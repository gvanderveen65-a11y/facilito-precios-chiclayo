name: Actualizar precios Facilito Chiclayo
on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependencias
        run: pip install playwright openpyxl
      - name: Instalar navegador
        run: playwright install --with-deps chromium
      - name: Sacar precios y actualizar Excel
        run: python scrape_and_update.py
      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historial/Chiclayo_GasoholRegular_historial.xlsx
          git diff --quiet --cached || git commit -m "Actualiza precios Facilito $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
